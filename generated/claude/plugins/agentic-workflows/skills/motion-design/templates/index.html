<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editable motion study</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #121411; }
    #study { position: relative; width: 100%; height: 100%; overflow: hidden; background: #121411; }
    #orb { position: absolute; left: 160px; top: 330px; width: 420px; height: 420px; border-radius: 50%; background: #d5ff5f; }
    #line { position: absolute; left: 210px; top: 750px; width: 1450px; height: 3px; background: #d5ff5f; transform-origin: left; }
    #caption { position: absolute; left: 720px; top: 395px; width: 1000px; color: #f7f7ef; font: 700 140px/1.02 system-ui, sans-serif; letter-spacing: -7px; }
    #detail { position: absolute; left: 730px; top: 570px; width: 980px; color: #a8afa0; font: 400 34px/1.3 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main id="study" data-composition-id="study" data-width="1920" data-height="1080" data-duration="6" data-fps="60">
    <div id="orb"></div><div id="line"></div>
    <div id="caption">Make it move.</div>
    <div id="detail">An editable scene. One timeline.</div>
  </main>
  <!-- Copy the project's pinned node_modules/gsap/dist/gsap.min.js here. -->
  <script src="gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    window.motionReady = document.fonts.ready.then(() => {
      const timeline = gsap.timeline({ paused: true });
      timeline.fromTo('#orb', { scale: 0, rotation: -45 }, { scale: 1, rotation: 0, duration: 1.1, ease: 'expo.out' }, 0);
      timeline.fromTo('#caption', { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.85, ease: 'power3.out' }, 0.35);
      timeline.fromTo('#detail', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.7);
      timeline.fromTo('#line', { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: 'power3.inOut' }, 0.5);
      timeline.to('#orb', { x: 40, duration: 3, ease: 'sine.inOut' }, 1.5);
      timeline.to('#caption, #detail', { y: -35, opacity: 0, duration: 0.55, ease: 'power3.in' }, 5.2);
      window.__timelines.study = timeline;
      window.seek = seconds => { timeline.totalTime(Math.max(0, Math.min(6, seconds)), true); };
      window.seek(0);
    });
  </script>
</body>
</html>
