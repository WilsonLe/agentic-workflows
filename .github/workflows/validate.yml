name: Validate plugins

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install ImageMagick 7
        run: brew install imagemagick
      - name: Run repository validation
        run: uv run python scripts/validate_repository.py

  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Verify platform-neutral plugin tooling and review fixtures
        shell: pwsh
        run: |
          uv run python -m unittest discover -s tests -p test_transfer_portability.py -v
          uv run python -m unittest discover -s tests -p test_literature_review.py -v
          uv run python -m unittest discover -s tests -p test_systematic_literature_review.py -v

  codex-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Verify generated packages
        run: |
          uv run --locked python scripts/generate_plugin_packages.py --check
          uv run --locked python scripts/generate_plugin_packages.py --build "$RUNNER_TEMP/distribution"
      - name: Validate staged Codex package
        run: uv run --locked python scripts/validate_plugin_packages.py --build-root "$RUNNER_TEMP/distribution"
