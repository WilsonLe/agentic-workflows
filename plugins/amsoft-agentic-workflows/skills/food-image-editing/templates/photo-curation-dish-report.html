<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dish Candidate Review</title>
  <style>
    :root { color-scheme:dark; --bg:#0d0d0c; --panel:#171715; --ink:#f5f1e8; --muted:#aaa69c; --line:#393832; --pick:#86c98a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,sans-serif; }
    header, main { width:min(1500px,calc(100% - 36px)); margin:auto; }
    header { padding:30px 0 20px; }
    .back { color:var(--muted); text-decoration:none; }
    h1 { margin:20px 0 0; font:700 clamp(34px,6vw,66px)/1 Georgia,serif; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
    .meta span { padding:7px 10px; border:1px solid var(--line); border-radius:999px; background:var(--panel); }
    section { margin-top:32px; padding-top:24px; border-top:1px solid var(--line); }
    h2 { margin:0 0 14px; font:700 32px/1.1 Georgia,serif; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; }
    article { overflow:hidden; border:1px solid var(--line); border-radius:13px; background:var(--panel); }
    article.selected { border-color:var(--pick); }
    .visual { position:relative; aspect-ratio:16/9; overflow:hidden; background:#090909; }
    .visual-inner { position:absolute; inset:0; }
    .visual-inner.rotated { width:56.25%; height:177.7778%; inset:auto; left:50%; top:50%; transform:translate(-50%,-50%) rotate(var(--rotation)); }
    img { display:block; width:100%; height:100%; object-fit:cover; }
    .rank { position:absolute; top:9px; left:9px; display:grid; min-width:32px; height:32px; place-items:center; border-radius:8px; background:rgba(13,13,12,.88); font-weight:850; }
    .details { padding:12px 13px 15px; }
    .title-row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
    h3 { margin:0; font-size:16px; }
    .decision { color:var(--muted); font-size:11px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }
    .selected .decision { color:var(--pick); }
    p { margin:8px 0 0; color:#d2cec5; }
    @media(max-width:960px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media(max-width:600px){ .grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header>
    <a id="back" class="back" href="#">← Photo curation</a>
    <h1 id="dish"></h1>
    <div id="meta" class="meta"></div>
  </header>
  <main id="report"></main>
  <script>
    const review = {
      dish: "Dish name",
      status: "TBD",
      delivery: "16:9",
      constraints: [],
      backHref: "photo-curation-main-report.html",
      sections: [
        // {
        //   angle: "top-down",
        //   candidates: [
        //     {stem:"IMG_0001",src:"../JPG/IMG_0001.JPG",selected:true,rotation:0,reason:"Image-specific reason."}
        //   ]
        // }
      ]
    };
    document.querySelector("#dish").textContent = review.dish;
    document.querySelector("#back").href = review.backHref;
    document.title = `${review.dish} — Candidate Review`;
    const meta = document.querySelector("#meta");
    [review.status, review.delivery, ...review.constraints].forEach(value => {
      const item = document.createElement("span");
      item.textContent = value;
      meta.append(item);
    });
    const report = document.querySelector("#report");
    review.sections.forEach(sectionData => {
      const section = document.createElement("section");
      const heading = document.createElement("h2");
      heading.textContent = sectionData.angle;
      const grid = document.createElement("div");
      grid.className = "grid";
      sectionData.candidates.forEach((candidate,index) => {
        const article = document.createElement("article");
        if(candidate.selected) article.className = "selected";
        const visual = document.createElement("div");
        visual.className = "visual";
        const inner = document.createElement("div");
        inner.className = `visual-inner${candidate.rotation ? " rotated" : ""}`;
        inner.style.setProperty("--rotation",`${candidate.rotation || 0}deg`);
        const image = document.createElement("img");
        image.src = candidate.src;
        image.alt = `${review.dish}, ${sectionData.angle}, ${candidate.stem}`;
        image.loading = "lazy";
        inner.append(image);
        const rank = document.createElement("span");
        rank.className = "rank";
        rank.textContent = index + 1;
        visual.append(inner,rank);
        const details = document.createElement("div");
        details.className = "details";
        const row = document.createElement("div");
        row.className = "title-row";
        const title = document.createElement("h3");
        title.textContent = candidate.stem;
        const decision = document.createElement("span");
        decision.className = "decision";
        decision.textContent = candidate.selected ? "Selected" : "Not selected";
        row.append(title,decision);
        const reason = document.createElement("p");
        reason.textContent = candidate.reason;
        details.append(row,reason);
        article.append(visual,details);
        grid.append(article);
      });
      section.append(heading,grid);
      report.append(section);
    });
  </script>
</body>
</html>
