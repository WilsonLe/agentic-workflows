<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Curation</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0d0c; --panel:#171715; --ink:#f5f1e8; --muted:#aaa69c; --line:#393832; --accent:#e7a84b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,sans-serif; }
    header, main { width:min(1500px,calc(100% - 36px)); margin:auto; }
    header { padding:30px 0 24px; }
    h1 { margin:0; font:700 clamp(34px,6vw,66px)/1 Georgia,serif; }
    #search { width:min(100%,420px); margin-top:20px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--ink); font:inherit; }
    main { display:grid; gap:20px; padding-bottom:60px; }
    article { overflow:hidden; border:1px solid var(--line); border-radius:16px; background:var(--panel); }
    .dish-head { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:16px 18px; border-bottom:1px solid var(--line); }
    h2 { flex:1 1 260px; margin:0; font:700 28px/1.1 Georgia,serif; }
    .status { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-size:11px; }
    .review { border:1px solid var(--line); border-radius:8px; padding:7px 10px; text-decoration:none; }
    .review:hover { border-color:var(--accent); }
    .angles { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
    section { min-width:0; padding:15px; border-right:1px solid var(--line); }
    section:last-child { border-right:0; }
    h3 { margin:0 0 10px; color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    .frames { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    figure { margin:0; overflow:hidden; border:1px solid var(--line); border-radius:10px; }
    .visual { position:relative; aspect-ratio:16/9; overflow:hidden; background:#090909; }
    .visual-inner { position:absolute; inset:0; }
    .visual-inner.rotated { width:56.25%; height:177.7778%; inset:auto; left:50%; top:50%; transform:translate(-50%,-50%) rotate(var(--rotation)); }
    img { width:100%; height:100%; display:block; object-fit:cover; }
    figcaption { padding:8px 9px; font-weight:800; }
    .empty { padding:24px; border:1px dashed var(--line); border-radius:10px; text-align:center; color:var(--muted); }
    @media(max-width:900px){ .angles{grid-template-columns:1fr} section{border-right:0;border-bottom:1px solid var(--line)} section:last-child{border-bottom:0} }
    @media(max-width:520px){ .frames{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header>
    <h1 id="title"></h1>
    <input id="search" type="search" placeholder="Search dishes or frames" autocomplete="off">
  </header>
  <main id="gallery"></main>
  <script>
    const report = {
      title: "Photo curation",
      angles: ["top-down", "45-degree", "close-up"],
      dishes: [
        // {
        //   label: "Dish name", status: "confirmed",
        //   reviewHref: "dish-review.html",
        //   selections: {
        //     "top-down": [{stem:"IMG_0001",src:"../JPG/IMG_0001.JPG",rotation:0}],
        //     "45-degree": [], "close-up": []
        //   }
        // }
      ]
    };
    const title = document.querySelector("#title");
    const search = document.querySelector("#search");
    const gallery = document.querySelector("#gallery");
    title.textContent = report.title;
    document.title = report.title;

    function frameCard(frame) {
      const figure = document.createElement("figure");
      const visual = document.createElement("div");
      visual.className = "visual";
      const inner = document.createElement("div");
      inner.className = `visual-inner${frame.rotation ? " rotated" : ""}`;
      inner.style.setProperty("--rotation", `${frame.rotation || 0}deg`);
      const image = document.createElement("img");
      image.src = frame.src;
      image.alt = frame.stem;
      image.loading = "lazy";
      inner.append(image);
      visual.append(inner);
      const caption = document.createElement("figcaption");
      caption.textContent = frame.stem;
      figure.append(visual, caption);
      return figure;
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const dishes = report.dishes.filter(dish => {
        const stems = Object.values(dish.selections).flat().map(frame => frame.stem).join(" ");
        return !query || `${dish.label} ${stems}`.toLowerCase().includes(query);
      });
      gallery.replaceChildren(...dishes.map(dish => {
        const article = document.createElement("article");
        const head = document.createElement("div");
        head.className = "dish-head";
        const heading = document.createElement("h2");
        heading.textContent = dish.label;
        const status = document.createElement("span");
        status.className = "status";
        status.textContent = dish.status;
        head.append(heading, status);
        if (dish.reviewHref) {
          const link = document.createElement("a");
          link.className = "review";
          link.href = dish.reviewHref;
          link.textContent = "Review";
          head.append(link);
        }
        const angles = document.createElement("div");
        angles.className = "angles";
        report.angles.forEach(angle => {
          const section = document.createElement("section");
          const angleHeading = document.createElement("h3");
          angleHeading.textContent = angle;
          const frames = document.createElement("div");
          frames.className = "frames";
          const selections = dish.selections[angle] || [];
          if (selections.length) selections.forEach(frame => frames.append(frameCard(frame)));
          else {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "—";
            frames.append(empty);
          }
          section.append(angleHeading, frames);
          angles.append(section);
        });
        article.append(head, angles);
        return article;
      }));
    }
    search.addEventListener("input", render);
    render();
  </script>
</body>
</html>
