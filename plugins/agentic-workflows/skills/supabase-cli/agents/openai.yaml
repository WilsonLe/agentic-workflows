interface:
  display_name: "Supabase Account Operations"
  short_description: "Manage Supabase with Infisical-backed CLI tokens"
  default_prompt: "Use $supabase-cli with the supabase CLI and tokens obtained from Infisical. Load $infisical-account-operations, verify provider identity and exact target read-only, conceal credentials in child environments, execute only authorized operations, and read back results. Report missing tokens, permissions or CLI capabilities without connector or cached-login fallback."
