  short_description: "Manage DigitalOcean with Infisical-backed CLI tokens"
  default_prompt: "Use $digitalocean-account-operations with the doctl CLI and tokens obtained from Infisical. Load $infisical-account-operations, verify provider identity and exact target read-only, conceal credentials in child environments, execute only authorized operations, and read back results. Report missing tokens, permissions or CLI capabilities without connector or cached-login fallback."
