interface:
  display_name: "Infisical Account Operations"
  short_description: "Inventory provider keys and deliver typed credentials"
  default_prompt: "Use $infisical-account-operations to discover provider key names, get or set scoped secrets, and deliver only the selected token, PEM, JSON or signing inputs to their provider CLI or authorized runtime. Verify vault scope and provider target, conceal values, and report missing access without credential or channel fallback."
