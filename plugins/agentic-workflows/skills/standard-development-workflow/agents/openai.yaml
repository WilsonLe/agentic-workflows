interface:
  display_name: "Standard Development Workflow"
  short_description: "Clarify, plan, design, and ship scoped changes"
  default_prompt: "Use $standard-development-workflow to deliver this repository change through Grill Me, planning, design specification, isolated implementation, focused verification, a bounded adversarial review/fix cycle with final-state review, and a draft PR. Before sending the final chat reply, check its actual text against the handoff contract and include the PR executive summary with structure, review status, verification commands/results, and limits."
policy:
  allow_implicit_invocation: true
