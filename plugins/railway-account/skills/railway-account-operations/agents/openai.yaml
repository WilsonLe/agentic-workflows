interface:
  display_name: "Railway Account Operations"
  short_description: "Authenticated CLI with browser login support"
  default_prompt: "Keep credentials in the project gitignored .cli/railway store and carry them with local env files into new worktrees. Use $railway-account-operations with an authenticated CLI/client for this project. If not authenticated, use the built-in Codex browser for login or secure key/token acquisition, verify CLI identity and target, and use browser operations only for unsupported CLI capabilities."
policy:
  allow_implicit_invocation: true
