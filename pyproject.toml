[project]
name = "amsoft-agentic-workflow-codex-plugin"
version = "0.0.0"
description = "Development and validation environment for the AMSoft Codex plugin marketplace."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==49.0.0",
  "jsonschema==4.25.1",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "ruff==0.1.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
