[project]
name = "agentic-workflows"
version = "0.0.0"
description = "Development and validation environment for Agentic Workflows plugins."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==50.0.0",
  "jsonschema==4.25.1",
  "Pillow==11.3.0",
  "PyYAML==6.0.3",
  "segno==1.6.6",
  "zxing-cpp==2.3.0",
]

[dependency-groups]
dev = [
  "ruff==0.1.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
