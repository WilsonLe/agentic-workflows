  - restaurant-marketing
  - payloadcms
  - systematic-literature-review
  - trend-to-product
  - youtube
  - david-jones-customer-service
  - reddit
reference_contract:
  allowed_roots:
  - plugin-root
  - skill-root
  local_asset_prefixes:
  - references
  - scripts
  - schemas
  - examples
  - templates
  metadata_prompt_requires_skill_invocation: true
  required_authoring_skills:
  - name: plugin-creator
    fallback: Use the repository catalog, deterministic generator, package validator,
      registry checks, and installed-state diagnostic; record that plugin-creator
      was unavailable.
registry_contract:
  unavailable_source_prefix: 'external-unavailable:'
  unverified_marker: not-live-verified
