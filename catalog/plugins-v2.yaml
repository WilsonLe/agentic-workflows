- name: agent-orchestration
  display_name: Agent Orchestration
  path: plugins/agent-orchestration
  category: Productivity
  policy:
    installation: AVAILABLE
    authentication: ON_INSTALL
  registry_name: agent-orchestration
  runtime_dependencies:
  - Python 3.10 or newer
  - Codex host goal and task-management capabilities
  - Codex host child Full Access and Goal/Plan selection plus authoritative setting
    readback
  - Host-authoritative gpt-5.6-luna/max selection and effective model/reasoning readback
    for review, verification, and remediation turns
  - Mandatory-autopilot one-foreground-issue triage with persisted gate decisions
    and stop-or-blocked pass-2 closeout
  - Owner-only register locks, persisted revision compare-and-swap, stable realpath-normalized
    same-worktree claims, and transactional claim-sidecar persistence
  - Same unchanged full base/head review and verification pair plus authoritative
    terminal-verifier archive/release before implementation archive or cleanup intent
  - Failed Luna/max remediation readback blocks source work, and ambiguous v4 ownership
    migrations fail closed
  executables:
  - scripts/orchestration_state.py
  skills:
  - name: orchestration
    agent_metadata: required
    harnesses:
    - codex
    prerequisites:
    - name: Python runtime
