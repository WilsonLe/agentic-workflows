    - name: Git and GitHub CLI
      required: true
      setup: Install Git and authenticate gh for the target repository.
    - name: Codex task controls
      required: true
      setup: Use a Codex host that exposes task creation, model readback, and worktree
        controls.
  - name: sdlc-loop
