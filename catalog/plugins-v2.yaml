schema_version: 2
marketplace:
  name: agentic-workflows
  display_name: Agentic Workflows
  path: .agents/plugins/marketplace.json
  plugin_order:
  - agentic-workflows
reference_contract:
  allowed_roots:
  - plugin-root
  - skill-root
  local_asset_prefixes:
  - references
  - scripts
  - schemas
  - examples
  - templates
  metadata_prompt_requires_skill_invocation: true
  required_authoring_skills:
  - name: plugin-creator
    fallback: Use the repository catalog, deterministic generator, package validator,
      registry checks, and installed-state diagnostic; record that plugin-creator
      was unavailable.
registry_contract:
  unavailable_source_prefix: 'external-unavailable:'
  unverified_marker: not-live-verified
packages:
- name: agentic-workflows
  display_name: Agentic Workflows
  path: plugins/agentic-workflows
  category: Productivity
  policy:
    installation: AVAILABLE
    authentication: ON_USE
  registry_name: agentic-workflows
  runtime_dependencies:
  - Python 3.10 or newer
  - yt-dlp and FFmpeg/ffprobe for supported media sites; Deno or Node for YouTube
  - Current Node.js LTS, npx, compatible Chrome, and Chrome DevTools MCP only for extension runtime verification
  - Node.js 22 or newer, a project-local HyperFrames CLI, and FFmpeg/ffprobe for motion video rendering
  - Codex provider plugins/connected apps for remote operations; repository-required local development tools remain separate
  executables:
  - scripts/account_credential_common.py
  - scripts/openrouter_transcribe.py
  - scripts/diagnose_installed_plugins.py
  - scripts/calorie_tracker.py
  - scripts/orchestration_state.py
  - scripts/agentic_workflow_config_transfer.py
  - skills/agentic-workflows-config-transfer/scripts/codex_config.py
  - scripts/youtube_cookie_store.py
  - scripts/youtube_yt_dlp.py
  - scripts/trend_to_product.py
  - scripts/qr_code_generator.py
  - skills/academic-writing-workflow/scripts/init_academic_project.py
  - skills/literature-review-workflow/scripts/literature_review.py
  - skills/restaurant-marketing-management/scripts/restaurant_marketing.py
  - skills/standard-development-workflow/scripts/standard_workflow_record.py
  - skills/standard-development-workflow/scripts/check_async_feedback.py
  - skills/standard-development-workflow/scripts/project_adrs.py
  - skills/agentic-workflows/scripts/check_goal_continuity.py
  - skills/session-reflection/scripts/reflection_state.py
  - hooks/session_title.py
  - skills/verified-literature-research/scripts/verify_research_bundle.py
  - skills/systematic-literature-review-workflow/scripts/systematic_review.py
  - skills/chrome-extensions/scripts/audit_extension.py
  - skills/motion-design/scripts/verify_video.py
  - skills/music-composition/scripts/synthesize_score.py
  - skills/video-editing/scripts/index_assets.py
  - skills/video-editing/scripts/editonny_transcript.py
  skills:
  - name: academic-writing-workflow
    agent_metadata: required
    harnesses: &codex-harnesses [codex]
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer before running the bundled helper scripts.
  - name: agentic-workflows
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: delegation
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Native task or session controls
      required: true
      setup: Use Codex's supported creation and management controls; verify settings through native metadata or documented inheritance of the active configuration.
  - name: engineering-intake
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: engineering-diagnosis
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: engineering-review
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: engineering-exploration
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: ponytail
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: grill-me
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: interactive-plan
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: agent-instruction-design
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: human-setup-guide
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: agentic-workflows-config-transfer
    agent_metadata: required
    harnesses:
    - codex
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer before running the bundled helper scripts.
    - name: Codex local configuration
      required: true
      setup: Use a supported Codex installation with local preference files and access
        to its OS-protected local encryption key; provider connections remain managed by Codex.
  - name: session-reflection
    agent_metadata: required
    harnesses:
    - codex
    prerequisites:
    - name: Codex session history
      required: true
      setup: Use a host that can list and read the relevant sessions; report unavailable hosts.
    - name: GitHub CLI
      required: true
      setup: Authenticate gh with read access to the target issue repository; issue write access is needed only when requested.
  - name: orchestration
    agent_metadata: required
    harnesses:
    - codex
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
    - name: Git and GitHub CLI
      required: true
      setup: Install Git and authenticate gh for the target repository.
    - name: Codex task controls
      required: true
      setup: Use a Codex host that exposes task creation, model readback, and worktree
        controls.
  - name: sdlc-loop
    agent_metadata: required
    harnesses:
    - codex
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
    - name: Git and GitHub CLI
      required: true
      setup: Install Git and authenticate gh for the target repository.
    - name: Codex task controls
      required: true
      setup: Use a Codex host that exposes task creation, model readback, and worktree
        controls.
  - name: cloudflare-account-operations
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Connected Cloudflare app
      required: true
      setup: Use the configured Cloudflare plugin/connected app in Codex. Reuse Codex-managed authentication and verify the exact account/project/environment through tools. Recover missing connections through Codex and report unavailable operations or permissions without local CLI tokens or dashboard fallback.
  - name: calorie-tracker
    agent_metadata: required
    harnesses:
    - codex
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
    - name: Meal image input
      required: true
      setup: Provide an authorized meal image and any known portion details.
    - name: Google Drive and Sheets connector
      required: false
      setup: Connect private Drive and Sheets destinations before requesting logging.
  - name: digitalocean-account-operations
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Connected DigitalOcean app
      required: true
      setup: Use the configured DigitalOcean plugin/connected app in Codex. Reuse Codex-managed authentication and verify the exact account/project/environment through tools. Recover missing connections through Codex and report unavailable operations or permissions without local CLI tokens or dashboard fallback.
  - name: railway-account-operations
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Connected Railway app
      required: true
      setup: Use the configured Railway plugin/connected app in Codex. Reuse Codex-managed authentication and verify the exact account/project/environment through tools. Recover missing connections through Codex and report unavailable operations or permissions without local CLI tokens or dashboard fallback.
  - name: vercel-account-operations
    agent_metadata: required
    harnesses: [codex]
    prerequisites:
    - name: Connected Vercel app
      required: true
      setup: Enable the Vercel plugin/connected app in Codex and use its exposed tools; verify the connected identity and exact team/project/environment before operations. If disconnected or unsupported, report the connection or capability blocker.
  - name: supabase-cli
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Connected Supabase app
      required: false
      setup: Required for remote operations only; use the configured Supabase plugin/connected app in Codex. Reuse Codex-managed authentication and verify the exact account/project/environment through tools. Recover missing connections through Codex and report unavailable operations or permissions without local CLI tokens or dashboard fallback.
    - name: Local Supabase development tools
      required: false
      setup: Use repository-required Supabase CLI commands only for proven local-only development; they do not authenticate remote connected-app operations.
  - name: literature-review-workflow
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
  - name: guided-writing-coach
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: restaurant-marketing-management
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
  - name: systematic-literature-review-workflow
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
  - name: trend-product-design
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
    - name: Image generation tool
      required: false
      setup: Connect an image generation tool only when approved concept art is requested.
  - name: trend-product-discovery
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
  - name: trend-product-onboarding
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
  - name: trend-product-operations
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
  - name: trend-product-opportunity
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
  - name: food-image-editing
    agent_metadata: required
    harnesses:
    - codex
    prerequisites:
    - name: OpenAI image editing tool
      required: true
      setup: Connect the supported image editing tool and provide authorized source
        images.
  - name: qr-code-generation
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install uv, which provides Python 3.12 or 3.13 for the helper, or install
        one of those Python versions yourself.
    - name: Python QR dependencies
      required: true
      setup: Run the helper with uv run, which installs its pinned Segno, Pillow, and
        zxing-cpp versions, or install those versions for Python 3.12 or 3.13.
    - name: Image generation tool
      required: false
      setup: Connect an image generation tool only for optional themed backgrounds.
  - name: humanizer
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: standard-development-workflow
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Git and GitHub CLI
      required: true
      setup: For repository delivery, install Git with worktree support and authenticate gh for the target repository. No-diff operational cleanup uses the host's supported inventory and cleanup controls.
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer for repository completion checks and structured evidence/ADR helpers. Unstructured no-diff cleanup does not need these helpers.
  - name: verified-literature-research
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer before running the bundled helper scripts.
  - &rea-setup-skill
    name: rea-setup
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: REA setup runtime
      required: true
      setup: Provide Node.js and npm/npx supported by the current REA release; check upstream setup requirements before running it.
  - name: payloadcms-development
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Payload project
      required: true
      setup: Open a Payload project and install its declared development dependencies.
  - name: youtube-content-inspection
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
    - name: yt-dlp
      required: true
      setup: Install yt-dlp; install FFmpeg for media transformations.
  - name: youtube-library-sync
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
    - name: yt-dlp
      required: true
      setup: Install yt-dlp; install FFmpeg for media transformations.
  - name: youtube-media-operations
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer and the package dependencies before running
        its helper scripts.
    - name: yt-dlp
      required: true
      setup: Install yt-dlp; install FFmpeg for media transformations.
  - name: budgeting-account-sync
    agent_metadata: required
    harnesses: [codex]
    prerequisites: &budgeting-prerequisites
    - name: Authenticated built-in browser
      required: true
      setup: Open Actual Budget and Commonwealth NetBank and log in to both in Codex's built-in browser. The user restores expired logins before ledger changes.
  - name: budgeting-transactions
    agent_metadata: required
    harnesses: [codex]
    prerequisites: *budgeting-prerequisites
  - name: reddit-browsing
    agent_metadata: required
    harnesses:
    - codex
    prerequisites:
    - name: Supported browser controls
      required: true
      setup: Use the Codex built-in browser by default, including after a blocked web read.
        Honor an explicit browser choice; use another supported browser only for a capability
        gap, never to evade a gate. The user handles required login or age verification.
  - name: ui-design
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  - name: product-playtest
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Supported browser controls and reachable app
      required: true
      setup: Provide a running app or URL and supported host browser controls; use authorized test accounts or disposable fixtures for state-changing journeys.
  - name: video-editing
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Local media tools
      required: true
      setup: Provide FFmpeg and ffprobe plus an existing editor or compositor; Python 3.10 or newer runs the asset index helper. Motion Design's rendering runtime is needed only for animated scenes.
  - name: product-growth
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Research, media and outcome evidence
      required: false
      setup: Planning needs only a product brief. Use supported research or authorized exports and outcome data for measured learning; media production needs the selected existing production skill's tools and permitted assets. Missing evidence stays unknown. No paid SEO suite is required.
  - name: trading-strategy-research
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Financial sources and research tools
      required: false
      setup: Investment memos and hypothesis work use available dated sources without an extra runtime. Portfolio-specific analysis needs authorized holdings and risk limits. Measured experiments require historical data and an inspected project backtest engine; verify instrument specifications, timing and costs before performance claims.
  - name: seo-audit
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Site evidence and optional outcome data
      required: false
      setup: Use supported browser/research tools, existing project tools or supplied site files and exports. Rendered-page, search-index and field-performance claims need their respective evidence; missing channels remain unassessed. No paid SEO suite is required.
  - name: speech-to-text
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Speech recognition capability
      required: true
      setup: Use an available host transcription tool, a local STT runtime, or an explicitly selected hosted provider.
    - name: OpenRouter transcription
      required: false
      setup: For the explicitly selected OpenRouter runtime, provide FFmpeg, ffprobe and OPENROUTER_API_KEY through the approved process environment. No project credential file or key-copy step is used. Obtain authority for the exact audio upload and cost.
  - name: text-to-speech
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Speech synthesis capability
      required: true
      setup: Use an available host speech tool or local TTS runtime and licensed voice model; cloud synthesis requires scoped authority and access. Provide an audio decoder for output checks.
  - name: audio-editing
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Audio post-production tools
      required: true
      setup: Provide an existing DAW or FFmpeg/ffprobe with the selected filters, playback and suitable metering; specialized restoration requires its own installed runtime.
  - name: typography
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Font inspection and rendering
      required: true
      setup: Use local licensed static fonts, a font inspector such as fontTools, and the target renderer. Network access is needed only for selected font discovery/downloads.
  - name: music-composition
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer for local standard-library synthesis and WAV inspection.
    - name: FFmpeg and ffprobe
      required: false
      setup: Provide FFmpeg and ffprobe when encoding compressed audio or mixing with video; the selected video timing owner retains final verification.
  - name: motion-design
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Motion rendering runtime
      required: true
      setup: Install Node.js 22 or newer, a project-local pinned HyperFrames CLI and animation dependencies, and a compatible Chromium browser. Use an existing project setup when available.
    - name: FFmpeg and ffprobe
      required: true
      setup: Provide FFmpeg and ffprobe on PATH or through the documented local binary overrides.
    - name: Python runtime
      required: true
      setup: Install Python 3.10 or newer for the bundled final-video verifier; it uses only the standard library.
  - name: chrome-extensions
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites:
    - name: Python runtime
      required: false
      setup: Install Python 3.10 or newer to run the bundled offline manifest audit.
    - name: Chrome DevTools runtime
      required: false
      setup: For browser verification, configure Chrome DevTools MCP with extension
        tools and a compatible Chrome version; consult references/devtools-testing.md
        before connecting a profile.
  - name: modern-web-guidance
    agent_metadata: required
    harnesses: *codex-harnesses
    prerequisites: []
  publisher: Wilson Le
  harnesses: *codex-harnesses
documentation:
  central_router: plugins/agentic-workflows/skills/agentic-workflows/SKILL.md
  central_onboarding: plugins/agentic-workflows/skills/agentic-workflows/references/onboarding.md
  plugin_registry: plugins/agentic-workflows/skills/agentic-workflows/references/plugin-registry.md
  readme: README.md
harnesses:
  codex:
    marketplace_path: .agents/plugins/marketplace.json
