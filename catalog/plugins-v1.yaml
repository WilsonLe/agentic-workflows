mirrors:
  - name: agent-orchestration-skill
    kind: prefixed_skill_set
    source: plugins/agent-orchestration/skills
    destination: plugins/amsoft-agentic-workflows/skills
    source_prefix: orchestration
    destination_prefix: amsoft-orchestration
    replacements:
      - from: "name: orchestration"
        to: "name: amsoft-orchestration"
      - from: "$orchestration"
        to: "$amsoft-orchestration"
      - from: 'display_name: "Agent Orchestration"'
        to: 'display_name: "AMSoft Agent Orchestration"'

  - name: agent-orchestration-helper
    kind: exact_file
    source: plugins/agent-orchestration/scripts/orchestration_state.py
    destination: plugins/amsoft-agentic-workflows/scripts/orchestration_state.py

  - name: literature-review-portable-assets
    kind: exact_tree
    source: plugins/literature-review/skills/literature-review-workflow
    destination: plugins/amsoft-agentic-workflows/skills/amsoft-literature-review-workflow
    exclude:
      - SKILL.md
      - openai.yaml
      - __pycache__

  - name: literature-review-skill
    kind: transformed_file
    source: plugins/literature-review/skills/literature-review-workflow/SKILL.md
    destination: plugins/amsoft-agentic-workflows/skills/amsoft-literature-review-workflow/SKILL.md
    replacements:
      - from: "name: literature-review-workflow"
        to: "name: amsoft-literature-review-workflow"
      - from: "companion `verified-literature-research` skill"
        to: "bundled `verified-literature-research` skill"
      - from: "through `academic-writing-workflow`"
        to: "through the bundled `academic-writing-workflow`"

  - name: literature-review-agent-metadata
    kind: transformed_file
    source: plugins/literature-review/skills/literature-review-workflow/agents/openai.yaml
    destination: plugins/amsoft-agentic-workflows/skills/amsoft-literature-review-workflow/agents/openai.yaml
    replacements:
      - from: 'display_name: "Literature Review Workflow"'
        to: 'display_name: "AMSoft Literature Review Workflow"'
      - from: "$literature-review-workflow"
        to: "$amsoft-literature-review-workflow"

  - name: food-image-editing
    kind: exact_tree
    source: plugins/image-editing/skills/food-image-editing
